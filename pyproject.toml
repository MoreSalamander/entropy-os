[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "one-engine"
version = "0.1.0"
description = "Composable intelligence: four autonomous engines converge into one engine that can itself be composed again."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
# Core stays deliberately small: these are the only packages an ENGINE's own
# venv needs to serve the Universal Engine Contract (fastapi/pydantic/httpx
# are already present in all four engine venvs at matching versions).
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Only the unified system's own venv needs Temporal — engines never import it.
# That is an architectural invariant, not a packaging accident: Temporal owns
# what the system is DOING over time, and must never leak into engine state.
orchestration = ["temporalio>=1.7"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["one_engine*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
