[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entropy-os"
version = "0.1.0"
description = "Entropy OS — the front door. Every dashboard and interview lives here; the engines live in Veritas, imported as a library."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    # The engine room. Declared so a clean clone resolves (the flaw my-AI-script
    # had with its undeclared engine dep); local development overrides this with
    # `pip install -e ../veritas` via ./dev.sh.
    "veritas @ git+https://github.com/MoreSalamander/veritas",
    # Runtime capabilities of veritas code paths the front door actually invokes:
    # the web studio renders in a real browser; the default Knowledge Graph
    # fetcher shells to yt-dlp with trafilatura for article text. These become
    # veritas extras once its pyproject narrows in the final split increment.
    "playwright>=1.40",
    "yt-dlp>=2024.1.0",
    "trafilatura>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["entropy_os*"]

# The front door's UI must ship in the wheel — a bare install answers 500 on /
# without it. The Fly image only ever worked because uvicorn's default app-dir
# put the COPY'd source tree on sys.path, shadowing site-packages; the same
# lesson the engine learned with its vendored prism assets (an installed
# package carries everything it serves). scripts/smoke_bare_install.sh guards
# this.
[tool.setuptools.package-data]
"entropy_os" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
