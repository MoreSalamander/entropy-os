[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "design-engine"
version = "0.1.0"
description = "AI-native Website Intelligence and Generation Engine on the research-engine substrate"
requires-python = ">=3.12"
dependencies = [
  "research-engine", "fastapi>=0.115", "uvicorn>=0.32", "httpx>=0.27",
  "pydantic>=2.10", "networkx>=3.4", "qdrant-client>=1.12",
  "beautifulsoup4>=4.12",
]

[tool.setuptools.packages.find]
include = ["design_engine*"]

[tool.setuptools.package-data]
design_engine = []
