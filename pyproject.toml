[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-engine"
version = "0.1.0"
description = "General Research Intelligence Engine — parallel research, context graph, knowledge graph"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.32", "httpx>=0.27", "pydantic>=2.10",
  "PyYAML>=6.0", "networkx>=3.4", "qdrant-client>=1.12", "SQLAlchemy>=2.0",
  "aiosqlite>=0.20", "feedparser>=6.0", "beautifulsoup4>=4.12", "greenlet>=3.1",
]

[tool.setuptools.packages.find]
include = ["research_engine*"]
