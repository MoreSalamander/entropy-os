# one-engine system topology.
#
# Members are addressed by URL, never by import path — the composite consumes
# every member through the contract over HTTP, which is the same way a
# higher-order system consumes the composite. repo/venv exist only so the
# launcher can start each adapter server inside its engine's OWN environment;
# the composite itself never reads them.

engines:
  research:
    repo: /Users/0ne29/MoreSalamander/research-engine
    venv: /Users/0ne29/MoreSalamander/research-engine/.venv
    port: 9101
    url: http://localhost:9101
  software:
    repo: /Users/0ne29/MoreSalamander/code-engine
    venv: /Users/0ne29/MoreSalamander/code-engine/.venv
    port: 9102
    url: http://localhost:9102
  university:
    repo: /Users/0ne29/MoreSalamander/learn-engine
    venv: /Users/0ne29/MoreSalamander/learn-engine/.venv
    port: 9103
    url: http://localhost:9103
  web:
    repo: /Users/0ne29/MoreSalamander/design-engine
    venv: /Users/0ne29/MoreSalamander/design-engine/.venv
    port: 9104
    url: http://localhost:9104

unified:
  name: one-engine
  port: 9100
  url: http://localhost:9100
  datahub_platform: one-engine

# Second-level composition: System B consumes the unified engine purely via
# unified.url — it has no engines: section entries of its own beyond that URL,
# which is exactly the point.
system_b:
  name: meta-studio
  port: 9200

datahub:
  gms_url: http://localhost:8080
  env: PROD

temporal:
  address: localhost:7233
  namespace: default
  task_queue: one-engine-objectives

events:
  # Durable unified event log (append-only JSONL). Engines keep only ring
  # buffers; history lives here and in DataHub.
  log_path: storage_data/events.jsonl
