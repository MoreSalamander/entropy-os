# one-engine topology for the Fly Machine.
#
# The laptop's config.yaml points each member at a repo path and a venv so the
# launcher can start every adapter inside its OWN environment. In the image
# there is exactly one environment and all five packages are installed into it,
# so `repo` and `venv` are deliberately empty: with no repo set, the adapter
# server skips its sys.path/chdir dance and imports the engine normally.
#
# The members still talk over HTTP on their own ports. That is not ceremony —
# the composite consumes them through the contract here exactly as it does on
# the laptop, so the hosted face is running the same system, not a flattened
# imitation of it.

engines:
  research:
    port: 9101
    url: http://127.0.0.1:9101
  software:
    port: 9102
    url: http://127.0.0.1:9102
  university:
    port: 9103
    url: http://127.0.0.1:9103
  web:
    port: 9104
    url: http://127.0.0.1:9104

unified:
  name: one-engine
  port: 9100
  url: http://127.0.0.1:9100
  datahub_platform: one-engine

system_b:
  name: meta-studio
  port: 9110

# Not reachable from the Machine, and deliberately not faked. The composite
# reports itself degraded without them rather than pretending: DataHub is where
# provenance is published from the laptop, and Temporal is the durable
# orchestrator for composed runs — neither is needed to READ what already ran.
datahub:
  gms_url: http://127.0.0.1:8080
  env: PROD

temporal:
  address: 127.0.0.1:7233
  namespace: default
  task_queue: one-engine-objectives

events:
  # Overridden by ONE_ENGINE_DATA at runtime so the log lives on the Fly
  # Volume, where the seeded run history is placed on first boot.
  log_path: storage_data/events.jsonl
