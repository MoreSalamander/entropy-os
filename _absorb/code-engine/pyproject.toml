[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-engine"
version = "0.1.0"
description = "AI-native Software Intelligence and Generation Platform on the research-engine substrate"
requires-python = ">=3.12"
dependencies = [
  "research-engine", "fastapi>=0.115", "uvicorn>=0.32", "httpx>=0.27",
  "pydantic>=2.10", "networkx>=3.4", "qdrant-client>=1.12", "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["code_engine*"]
