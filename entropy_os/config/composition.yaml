# System topology.
#
# Members are addressed by URL, never by import path — the composite consumes
# every member through the contract over HTTP, which is the same way a
# higher-order system consumes the composite. That is the property the whole
# recursion claim rests on, and it is why absorbing the engines into this
# repository changed this file so little: what moved was the SOURCE, not the
# way the parts talk to each other.
#
# What did go away are the `repo` and `venv` keys each member used to carry.
# They existed only so a launcher could start each adapter inside a different
# repository's virtualenv; the composite never read them. One repo, one
# environment, so there is nothing left to point at.

engines:
  research:
    port: 9101
    url: http://127.0.0.1:9101
  software:
    port: 9102
    url: http://127.0.0.1:9102
  university:
    port: 9103
    url: http://127.0.0.1:9103
  web:
    port: 9104
    url: http://127.0.0.1:9104

unified:
  name: one-engine
  port: 9100
  url: http://127.0.0.1:9100
  datahub_platform: one-engine

# Second-level composition: System B consumes the unified engine purely via
# unified.url — it has no engines: section entries of its own beyond that URL,
# which is exactly the point.
system_b:
  name: meta-studio
  # NOT 9200: that is OpenSearch's port, and DataHub's search backend binds
  # it. Squatting there silently breaks GraphQL search — which is what the
  # demo's export tooling reads — while REST ingest keeps working, so the
  # damage hides.
  port: 9110

datahub:
  gms_url: http://127.0.0.1:8080
  env: PROD

temporal:
  address: localhost:7233
  namespace: default
  task_queue: one-engine-objectives

events:
  # Durable unified event log (append-only JSONL), resolved against the
  # storage root so it follows ENTROPY_STORAGE onto a mounted volume.
  log_path: events.jsonl
